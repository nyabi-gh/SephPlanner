name: sephplanner
services:
  collector:
    image: sephplanner-collector:local
    build: .
    pull_policy: never
    restart: on-failure
    ports:
      - "10.77.0.2:8081:8080"
    environment:
      Diagnostics__StorageDirectory: /data/reports
      Diagnostics__AdminTokenFile: /run/secrets/diagnostics_admin_token
      Diagnostics__TrustedProxies__0: 10.77.0.1
      Logging__LogLevel__Default: Warning
    volumes:
      - type: bind
        source: /srv/nyas/sephplanner/reports
        target: /data/reports
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/admin-token.txt
        target: /run/secrets/diagnostics_admin_token
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16777216,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 초기 운영 추정 상한이며 실제 부하를 확인한 뒤 조정한다.
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "dotnet", "SephPlanner.Diagnostics.dll", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
