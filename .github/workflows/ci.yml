name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# 플러그인(src/SephPlanner.Plugin)은 여기서 빌드하지 않는다. 게임 어셈블리를 참조하는데
# 그것을 저장소나 CI 에 둘 수 없기 때문이다(docs/LEGAL.md - 게임 저작물 미배포).
# 그래서 플러그인만 깨지는 변경은 이 검사를 초록으로 통과한다. 밀기 전에 scripts/check.ps1 을
# 돌리면 같은 검사에 플러그인 빌드까지 함께 세운다.
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
      - run: dotnet restore tests/SephPlanner.Tests/SephPlanner.Tests.csproj --locked-mode
      - run: dotnet restore src/SephPlanner.DataTool/SephPlanner.DataTool.csproj --locked-mode
      - run: dotnet format src/SephPlanner.Core/SephPlanner.Core.csproj --verify-no-changes --no-restore
      - run: dotnet format tests/SephPlanner.Tests/SephPlanner.Tests.csproj --verify-no-changes --no-restore
      - run: dotnet test tests/SephPlanner.Tests/SephPlanner.Tests.csproj -c Release --no-restore
      - run: dotnet format src/SephPlanner.DataTool/SephPlanner.DataTool.csproj --verify-no-changes --no-restore
      - run: dotnet build src/SephPlanner.DataTool/SephPlanner.DataTool.csproj -c Release --no-restore
